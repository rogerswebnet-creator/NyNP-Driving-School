{% extends 'students/base.html' %}
{% block title %}Password Reset Sent{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-4 text-center">
                    <div class="mb-3 text-success fs-1"><i class="bi bi-check-circle-fill"></i></div>
                    <h4 class="mb-3">Password reset email sent</h4>
                    <p class="text-muted">If an account exists for the email you entered, we have sent a password reset link.</p>
                    <a href="{% url 'login' %}" class="btn btn-primary">Back to login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
