<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Registration Type</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f4f6f9;
        }
        .choice-container {
            max-width: 720px;
            margin: 90px auto;
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,.08);
        }
        .btn-choice {
            min-height: 120px;
            font-size: 1.1rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    {% include 'students/_navbar.html' %}

    <div class="container choice-container">
        <div class="card">
            <div class="card-header bg-primary text-white text-center py-4">
                <h3 class="mb-0">Choose Your Registration Type</h3>
            </div>
            <div class="card-body p-4">
                <p class="text-center text-muted mb-4">
                    Are you registering as a student or an instructor?
                </p>

                <div class="row g-3">
                    <div class="col-md-6">
                        <a href="{% url 'register' %}" class="btn btn-primary btn-choice w-100 d-flex align-items-center justify-content-center">
                            Student Registration
                        </a>
                    </div>
                    <div class="col-md-6">
                        <a href="{% url 'instructor_register' %}" class="btn btn-outline-primary btn-choice w-100 d-flex align-items-center justify-content-center">
                            Instructor Registration
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
