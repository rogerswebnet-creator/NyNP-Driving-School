{% extends 'students/base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-4 text-center">
                    <div class="mb-3 text-success fs-1"><i class="bi bi-shield-check"></i></div>
                    <h4 class="mb-3">Password updated successfully</h4>
                    <p class="text-muted">Your new password is now active. You can log in with it below.</p>
                    <a href="{% url 'login' %}" class="btn btn-primary">Go to login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
